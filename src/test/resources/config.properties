# ---- Appian instance config ----
# Appian Cloud Sites URL, e.g. https://mycompany.appiancloud.com/suite/sites/my-site-name
appian.site.url=https://<your-company>.appiancloud.com/suite/sites/<your-site-name>
appian.version=25.2
appian.locale=en_US
appian.timeout.seconds=60

# ---- Browser config ----
browser=chrome
headless=false

# ---- Reporting ----
reports.dir=reports
screenshots.dir=screenshots
